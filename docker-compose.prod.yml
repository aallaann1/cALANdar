version: '3.8'

services:
  db:
    image: postgres:15
    container_name: calandar-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password # Changer en prod !
      POSTGRES_DB: calandar
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/aallaann1/calandar-backend:latest
    container_name: calandar-backend
    restart: always
    ports:
      - "8006:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db/calandar
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

  frontend:
    image: ghcr.io/aallaann1/calandar-frontend:latest
    container_name: calandar-frontend
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
